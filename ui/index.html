<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Radio</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="radio-container" class="hidden">
        <div class="radio-card">
            <!-- Header: Displaying current status and playing station -->
            <div class="radio-header">
                <div class="status-indicator">
                    <span class="pulse-dot"></span>
                    <span class="status-text">AUTORADIO</span>
                </div>
                <div class="station-info-row">
                    <img id="active-station-logo" class="active-logo hidden" src="" alt="logo">
                    <div id="active-station-name" class="station-name">Vypnuto</div>
                </div>
                <div id="audio-visualizer" class="visualizer-container">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>

            <!-- Stations row: Clean circles populated dynamically -->
            <div id="stations-list" class="stations-container">
                <div id="stations-wrapper" class="stations-wrapper">
                    <!-- Will be populated dynamically via JavaScript -->
                </div>
            </div>
            
            <!-- Footer controls -->
            <div class="radio-footer">
                <span>Kolečko myši / Šipky - Výběr | Uvolněte [Q] pro zavření</span>
            </div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script src="script.js"></script>
</body>
</html>
